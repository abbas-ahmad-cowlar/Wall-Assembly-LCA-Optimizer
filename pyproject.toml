[project]
name = "wall-assembly-lca-optimizer"
version = "1.0.0"
description = "CLI tool to optimize 9-layer wall assemblies for minimal LCA impact while meeting thermal performance targets"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Abbas Ahmad", email = "abbas.ahmad@cowlar.com"}
]
dependencies = [
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
wall-optimizer = "main:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
